[project]
name = "overflow"
version = "8.0.1"
description = "overflow.no is the personal website of Aleksander Skraastad. I like programming, science & technology, gaming, cooking and the outdoors."
authors = ["Aleksander Skraastad <myth@overflow.no>"]
license = "MIT"
readme = "README.md"
package-mode = false
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "django-redis>=7.0.0",
    "markdown2>=2.5.5",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "pygments>=2.21.0",
    "python-decouple>=3.8",
    "uvicorn>=0.54.0",
]
[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "pyrefly>=1.3.2",
    "ruff>=0.16.10",
]

[tool.pyrefly]
python-version = "3.14"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
extend-select = [
  "A",        # Flake8 builtins
  "F",        # Pyflakes rules
  "W",        # PyCodeStyle warnings
  "E",        # PyCodeStyle errors
  "I",        # Sort imports properly
  "UP",       # Warn if certain things can changed due to newer Python versions
  "C4",       # Catch incorrect use of comprehensions, dict, list, etc
  "FA",       # Enforce from __future__ import annotations
  "ISC",      # Good use of string concatenation
  "ICN",      # Use common import conventions
  "RET",      # Good return practices
  "SIM",      # Common simplification rules
  "TID",      # Some good import practices
  "TC",       # Enforce importing certain types in a TYPE_CHECKING block
  "PTH",      # Use pathlib instead of os.path
  "NPY",      # Some numpy-specific things
]
ignore = [
  "TC006",  # incorrectly asks to quote types in typing.cast() operations
]

